name: Apply Supabase Migrations

# Auto-fires when a merge into main touches any file under supabase/migrations.
# Also exposes a manual button so the same job can be run against staging or
# replayed on demand. Solo-dev safe: prod runs only on the protected main
# branch, never on PR branches.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target project'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

# Prevent two concurrent runs from racing on the same project DB.
concurrency:
  group: supabase-migrations-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  production:
    if: >-
      ${{ github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.target == 'production') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF_PROD }}"

      - name: Show pending migrations (dry run)
        run: supabase db push --dry-run --include-all

      - name: Apply migrations
        run: supabase db push --include-all

  staging:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to staging project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF_STAGING }}"

      - name: Show pending migrations (dry run)
        run: supabase db push --dry-run --include-all

      - name: Apply migrations
        run: supabase db push --include-all
